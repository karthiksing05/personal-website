description = """
For Meta's Closer Together AI Hackathon at Menlo Park, 80 of us were selected from hackathons across the country and given 36 hours to answer one prompt: build a feature that makes Facebook useful and engaging for young adults. Our answer was Curios, a short-form interactive game format in the spirit of Wordle and Connections, where each Curio is a simple challenge with a themed rule set. Anyone can describe a tiny game in a sentence (our favorites were "Jensen Huang Honeypot Simulator" and "Escape the Office at 4:59"), Meta's Muse models build it, and the Curio plays right inside Facebook, in its own tab as well as in Groups, Events, Stories, and Reels. *When the world is your muse, how will you create the content of tomorrow?*
"""
